

services:
  # REDIS - Fraud Detection + Rate Limiting
  redis:
    image: redis:latest  # redis:version
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - banking-network

  # MYSQL - All Service Databases
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql  # volume-name:/container-path
    networks:
      - banking-network

  # ZOOKEEPER - Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0  #confluentinc/cp-zookeeper - The image name from Confluent's Docker registry (Confluent Platform Zookeeper) 7.4.0 - The specific version tag
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - banking-network

  # KAFKA - Event Streaming
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:   #This service depends on the zookeeper service being started first. depends_on means startup order, not "wait until ZooKeeper is fully ready."
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - banking-network

volumes:
  mysql-data:

networks:
  banking-network:
    driver: bridge
